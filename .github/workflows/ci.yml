name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit and end-to-end tests
        run: npm test
      - name: Validate plugin and marketplace
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate ./plugins/sdlc
          npx --yes @anthropic-ai/claude-code plugin validate .
